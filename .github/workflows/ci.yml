name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go build and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Coordinator
        working-directory: coordinator
        run: |
          go build ./...
          go vet ./...
      - name: Node daemon (headless)
        working-directory: node-gui
        run: |
          go build ./...
          go vet ./...

  node-frontend:
    name: Node app frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build
        working-directory: node-gui/frontend
        run: |
          npm ci
          npm run build

  admin-dashboard:
    name: Admin dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build
        working-directory: admin-dashboard
        env:
          AUTH_SECRET: ci
          COORDINATOR_API_URL: http://localhost:8081
        run: |
          npm ci
          npm run build

  python:
    name: Inference worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile llm-runner/inference_worker.py
